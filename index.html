<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="icon" type="image/png" href="favicon.png">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        body {
            background-color: #0d0f12; 
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
            font-family: 'League Spartan', Arial, sans-serif; 
            font-weight: 650; 
        }

        .container { 
            max-width: 550px; 
            width: 100%;
            background: #161a1f; 
            padding: 40px; 
            border-radius: 12px; 
            border: 1px solid #242b35;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); 
            text-align: center;
        }

        .profile-header {
            margin-bottom: 30px;
        }

        .orange-tag {
            font-family: 'League Spartan', Arial, sans-serif; 
            font-weight: 900; 
            color: #758DAB; 
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
            display: inline-block;
        }

        h1 { 
            font-size: 2.5rem; /* Slightly increased size to emphasize the capital first letters */
            margin-bottom: 12px; 
            letter-spacing: -0.5px; 
            font-family: 'League Spartan', Arial, sans-serif; 
            font-weight: 700; 
            font-variant: small-caps; /* Enables the small-caps engine */
        }    

        p { 
            font-size: 1.05rem; 
            margin-bottom: 30px; 
            color: #94a3b8; 
            line-height: 1.6; 
            text-align: left;
        }

        h2 {
            font-size: 1.8rem;
            margin-top: 30px;
            margin-bottom: 15px;
            color: #ffffff;
            text-align: center;
            border-bottom: 1px solid #242b35;
            padding-bottom: 8px;
            font-family: 'League Spartan', Arial, sans-serif; 
            font-weight: 800; 
        }

        .form-wrapper {
            position: relative;
            width: 100%;
            height: 1300px; 
            margin-bottom: 35px;
            background: #0d0f12;
            border-radius: 6px;
            border: 1px solid #242b35;
            overflow: hidden;
            font-family: 'League Spartan', Arial, sans-serif; 
            font-weight: 500; 
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .socials { 
            display: flex; 
            justify-content: center; 
            gap: 25px; 
            font-size: 0.95rem; 
            border-top: 1px solid #758DAB;
            padding-top: 25px;
            font-family: 'League Spartan', Arial, sans-serif; 
            font-weight: 900; 
        }

        .socials a { 
            color: #94a3b8; 
            text-decoration: none; 
            transition: color 0.2s; 
            font-weight: 500;
            font-family: 'League Spartan', Arial, sans-serif; 
            font-weight: 900; 
        }

        .socials a:hover { 
            color: #C7C6C6; 
        }

        /* High-Fluid Ultra-Swoosh Entrance Transition */
        .intro-sweep {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background-color: #758DAB;
            z-index: 9999;
            pointer-events: none;
            /* Uses a premium exponential curve that mimics physical liquid momentum deceleration */
            animation: liquidSwooshOut 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes liquidSwooshOut {
            0% {
                transform: scale(1);
                opacity: 1;
                filter: blur(0px);
            }
            30% {
                transform: scale(1.02);
                opacity: 1;
                filter: blur(2px);
            }
            100% {
                transform: scale(1.15); /* Billows outward like smoke/lens bloom */
                opacity: 0;
                filter: blur(24px); /* Dissolves away softly into darkness */
            }
        }
    </style>
</head>
<body>
    
    <div class="intro-sweep"></div>

        </div>

</body>

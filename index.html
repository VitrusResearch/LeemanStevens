<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leeman Stevens | R&D Engineer</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=League+Spartan:wght@500;650;700;800;900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="favicon.png">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        body {
            background-color: #0d0f12; 
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
            font-family: 'League Spartan', Arial, sans-serif; 
            font-weight: 650; 
        }

        .container { 
            max-width: 550px; 
            width: 100%;
            background: #161a1f; 
            padding: 40px; 
            border-radius: 12px; 
            border: 1px solid #242b35;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); 
            text-align: center;
        }

        .profile-header {
            margin-bottom: 30px;
        }

        .orange-tag {
            font-family: 'League Spartan', Arial, sans-serif; 
            font-weight: 900; 
            color: #758DAB; 
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
            display: inline-block;
        }

        h1 { 
            font-size: 2.5rem; 
            margin-bottom: 12px; 
            letter-spacing: -0.5px; 
            font-family: 'League Spartan', Arial, sans-serif; 
            font-weight: 700; 
            font-variant: small-caps; 
        }    

        p { 
            font-size: 1.05rem; 
            margin-bottom: 30px; 
            color: #94a3b8; 
            line-height: 1.6; 
            text-align: left;
        }

        h2 {
            font-size: 1.8rem;
            margin-top: 30px;
            margin-bottom: 15px;
            color: #ffffff;
            text-align: center;
            border-bottom: 1px solid #242b35;
            padding-bottom: 8px;
            font-family: 'League Spartan', Arial, sans-serif; 
            font-weight: 800; 
        }

        /* Viewport Window Box to crop disclaimer and bar elements */
        .form-wrapper {
            position: relative;
            width: 100%;
            height: 610px; /* Exact structural window depth for Desktop view fields */
            margin-bottom: 35px;
            background: #161a1f; 
            border-radius: 6px;
            border: 1px solid #242b35;
            overflow: hidden; /* Lock scrollbar rendering completely out of the frame */
        }

        /* Masking Matrix to pull inputs up and isolate footer junk lines */
        .form-wrapper iframe {
            position: absolute;
            top: -55px; /* Shaves off top header bar spacing gaps */
            left: 0;
            width: 100%;
            height: 720px; /* Extended internal depth to hold active fields before crop */
            border: none;
            overflow: hidden;
        }

        .socials { 
            display: flex; 
            justify-content: center; 
            gap: 25px; 
            font-size: 0.95rem; 
            border-top: 1px solid #758DAB;
            padding-top: 25px;
            font-family: 'League Spartan', Arial, sans-serif; 
            font-weight: 900; 
        }

        .socials a { 
            color: #94a3b8; 
            text-decoration: none; 
            transition: color 0.2s; 
            font-weight: 500;
            font-family: 'League Spartan', Arial, sans-serif; 
            font-weight: 900; 
        }

        .socials a:hover { 
            color: #C7C6C6; 
        }

        /* High-Fluid Ultra-Swoosh Entrance Transition */
        .intro-sweep {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background-color: #758DAB;
            z-index: 9999;
            pointer-events: none;
            animation: liquidSwooshOut 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes liquidSwooshOut {
            0% { transform: scale(1); opacity: 1; filter: blur(0px); }
            30% { transform: scale(1.02); opacity: 1; filter: blur(2px); }
            100% { transform: scale(1.15); opacity: 0; filter: blur(24px); }
        }

        /* Mobile Viewport Slicing Overrides */
        @media (max-width: 600px) {
            body {
                padding: 15px 10px; 
            }
            .container {
                padding: 24px 16px; 
                border-radius: 8px;
            }
            h1 {
                font-size: 2.1rem; 
            }
            /* Recalculated mobile dimensions to snap directly under input fields and hide banner */
            .form-wrapper {
                height: 740px; 
                margin-bottom: 25px;
            }
            .form-wrapper iframe {
                top: -45px;
                height: 840px;
            }
            .socials {
                gap: 15px; 
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    
    <div class="intro-sweep"></div>
    
    <div class="container">
        <div class="profile-header">
            <span class="orange-tag">R&D | Engineering | Design</span>
            <h1>Leeman Stevens</h1>
            <p>R&D Engineer specializing in high-performance mechanical designs, and turning complex conceptual product ideas into production-ready reality.</p>
        </div>

        <div class="socials">
            <a href="resume-leeman-stevens.pdf" target="_blank">View My Resume (PDF)</a>
            <a href="https://linkedin.com/LeemanStevens" target="_blank">LinkedIn</a>
            <a href="https://instagram.com/LeemanStevens" target="_blank">Instagram</a>
        </div>

        <h2>Contact Me</h2>
        
        <div class="form-wrapper">
            <!-- Embedded form cleanly framed with absolute tracking properties -->
            <iframe src="https://cloud.microsoft" scrolling="no"></iframe>
        </div>

        <div class="socials">
            <a href="resume-leeman-stevens.pdf" target="_blank">View My Resume (PDF)</a>
            <a href="https://linkedin.com/LeemanStevens" target="_blank">LinkedIn</a>
            <a href="https://instagram.com/LeemanStevens" target="_blank">Instagram</a>
        </div>
    </div>
</body>
</html>

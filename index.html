<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body {
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            padding: 20px;
        }
        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .container { max-width: 600px; background: rgba(255, 255, 255, 0.1); padding: 40px; border-radius: 16px; backdrop-filter: blur(10px); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2); }
        h1 { font-size: 2.5rem; margin-bottom: 10px; font-weight: 700; letter-spacing: -0.5px; }
        p { font-size: 1.1rem; margin-bottom: 30px; opacity: 0.9; line-height: 1.5; }
        form { display: flex; gap: 10px; margin-bottom: 30px; }
        input[type="email"] { flex: 1; padding: 12px 20px; border: none; border-radius: 8px; font-size: 1rem; outline: none; }
        button { background: #fff; color: #e73c7e; border: none; padding: 12px 24px; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; transition: transform 0.2s; }
        button:hover { transform: scale(1.02); }
        .socials { display: flex; justify-content: center; gap: 20px; font-size: 0.9rem; }
        .socials a { color: white; text-decoration: none; opacity: 0.7; transition: opacity 0.2s; }
        .socials a:hover { opacity: 1; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Something exciting is coming.</h1>
        <p>Our brand new website is under construction. Sign up to be the first to know when we launch!</p>
        <form onsubmit="alert('Thank you for subscribing!'); return false;">
            <input type="email" placeholder="Enter your email address" required>
            <button type="submit">Notify Me</button>
        </form>
        <div class="socials">
            <a href="#">Twitter</a>
            <a href="#">Instagram</a>
            <a href="#">Contact</a>
        </div>
    </div>
</body>
</html>

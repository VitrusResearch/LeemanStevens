<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leeman Stevens | R&D Engineer</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=League+Spartan:wght@500;650;700;800;900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="favicon.png">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        body {
            background-color: #0d0f12; 
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
            font-family: 'League Spartan', Arial, sans-serif; 
            font-weight: 650; 
        }

        .container { 
            max-width: 550px; 
            width: 100%;
            background: #161a1f; 
            padding: 40px; 
            border-radius: 12px; 
            border: 1px solid #242b35;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); 
            text-align: center;
        }

        .profile-header {
            margin-bottom: 30px;
        }

        .orange-tag {
            font-family: 'League Spartan', Arial, sans-serif; 
            font-weight: 900; 
            color: #758DAB; 
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
            display: inline-block;
        }

        h1 { 
            font-size: 2.2rem; 
            margin-bottom: 12px; 
            font-weight: 700; 
            letter-spacing: -0.5px; 
            font-family: 'League Spartan', Arial, sans-serif; 
            font-weight: 650; 
        }

        p { 
            font-size: 1.05rem; 
            margin-bottom: 30px; 
            color: #94a3b8; 
            line-height: 1.6; 
            text-align: left;
        }

        h2 {
            font-size: 1.8rem;
            margin-top: 30px;
            margin-bottom: 15px;
            color: #ffffff;
            text-align: center;
            border-bottom: 1px solid #242b35;
            padding-bottom: 8px;
            font-family: 'League Spartan', Arial, sans-serif; 
            font-weight: 800; 
        }

        .form-wrapper {
            position: relative;
            width: 100%;
            height: 1300px; 
            margin-bottom: 35px;
            background: #0d0f12;
            border-radius: 6px;
            border: 1px solid #242b35;
            overflow: hidden;
            font-family: 'League Spartan', Arial, sans-serif; 
            font-weight: 500; 
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .socials { 
            display: flex; 
            justify-content: center; 
            gap: 25px; 
            font-size: 0.95rem; 
            border-top: 1px solid #758DAB;
            padding-top: 25px;
            font-family: 'League Spartan', Arial, sans-serif; 
            font-weight: 900; 
        }

        .socials a { 
            color: #94a3b8; 
            text-decoration: none; 
            transition: color 0.2s; 
            font-weight: 500;
            font-family: 'League Spartan', Arial, sans-serif; 
            font-weight: 900; 
        }

        .socials a:hover { 
            color: #C7C6C6; 
        }

        /* Fluid Steel Blue Entrance Sweep */
        .intro-sweep {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background-color: #758DAB;
            z-index: 9999;
            pointer-events: none;
            /* Using a high-performance bezier curve for realistic momentum fluid motion */
            animation: fluidSweepOut 1.2s cubic-bezier(0.85, 0, 0.15, 1) forwards;
        }

        @keyframes fluidSweepOut {
            0% {
                transform: translateY(0%);
                opacity: 1;
            }
            40% {
                transform: translateY(0%);
                opacity: 1;
            }
            100% {
                transform: translateY(-100%);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    
    <div class="intro-sweep"></div>
    
    <div class="container">
        <div class="profile-header">
            <span class="orange-tag">Research & Development</span>
            <h1>Leeman Stevens</h1>
            <p>R&D Engineer specializing in high-performance mechanical designs, and turning complex conceptual product ideas into production-ready reality.</p>
        </div>

        <div class="socials">
            <a href="resume-leeman-stevens.pdf" target="_blank">View My Resume (PDF)</a>
            <a href="https://linkedin.com" target="_blank">LinkedIn</a>
            <a href="https://instagram.com" target="_blank">Instagram</a>
        </div>

        <h2>Contact Me</h2>
        
        <div class="form-wrapper">
            <iframe width="640px" height="1000px" src="https://cloud.microsoft" frameborder="0" marginwidth="0" marginheight="0" style="border: none; max-width:100%; max-height:2000px" allowfullscreen webkitallowfullscreen mozallowfullscreen msallowfullscreen> </iframe>
        </div>

        <div class="socials">
            <a href="resume-leeman-stevens.pdf" target="_blank">View My Resume (PDF)</a>
            <a href="https://linkedin.com" target="_blank">LinkedIn</a>
            <a href="https://instagram.com" target="_blank">Instagram</a>
        </div>
    </div>
</body>
</html>
